name: Windows build and tests

# اجرای خودکار روی هر push و PR. علاوه بر آن، با تگ `v*` یا اجرای دستی
# (workflow_dispatch) یک بستهٔ ZIP قابل دانلود ساخته و به GitHub Release چسبانده می‌شود.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # فقط برای ساخت ریلیز لازم است

env:
  # ساخت ریلیز فقط برای تگ یا اجرای دستی
  RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install -e './backend[test,ocr-experimental]'
          python -m pip install -r desktop/requirements.txt

      - name: Run backend tests
        shell: pwsh
        run: |
          python -m pytest backend/tests -q 2>&1 | Tee-Object -FilePath backend-tests.log
          exit $LASTEXITCODE

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-log
          path: backend-tests.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # فونت‌ها با برنامه بسته می‌شوند تا هر دستهٔ بالن فونت خودش را داشته باشد
      # (frontend/public/fonts شامل وزیرمتن و بستهٔ persian-pack است).
      - name: Build Windows desktop application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name T4Translate --paths backend
          --add-data "frontend/dist;web"
          --add-data "frontend/public/fonts;frontend/public/fonts"
          --collect-all rapidocr_onnxruntime
          --collect-all numpy
          --collect-all webview
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          desktop/launcher.py

      # نسخه و مخزن داخل بسته نوشته می‌شود تا برنامه بداند نسخهٔ فعلی چیست و
      # آپدیت را از کدام ریلیز بگیرد.
      - name: Stamp version info
        shell: pwsh
        run: |
          $tag = if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true") { "${{ github.ref_name }}" } else { "build-${{ github.run_number }}" }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0-$tag" }
          $info = [ordered]@{
            version = $version
            tag     = $tag
            repo    = "${{ github.repository }}"
            commit  = "${{ github.sha }}"
            builtAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          } | ConvertTo-Json
          Set-Content -Path 'dist/T4Translate/version.json' -Value $info -Encoding utf8
          "T4_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T4_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version: $version ($tag)"

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & .\dist\T4Translate\T4Translate.exe --smoke-test 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Desktop smoke test::$escaped"
            exit $code
          }

      - uses: actions/upload-artifact@v4
        with:
          name: T4Translate-Windows-${{ github.sha }}
          path: dist/T4Translate/
          if-no-files-found: error
          retention-days: 30

      - name: Package download bundle
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          Copy-Item packaging/README-Windows.txt 'dist/T4Translate/README-نصب.txt'
          Compress-Archive -Path 'dist/T4Translate/*' -DestinationPath "T4Translate-$env:T4_TAG-windows-x64.zip"
          Get-Item "T4Translate-$env:T4_TAG-windows-x64.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # فهرست همهٔ فایل‌ها + بستهٔ تغییرات نسبت به ریلیز منتشرشدهٔ قبلی. برنامهٔ
      # نصب‌شده با همین فهرست می‌فهمد کدام فایل‌ها عوض شده‌اند و فقط همان‌ها را
      # دانلود می‌کند (نه بستهٔ کامل ۱۲۰ مگابایتی).
      - name: Build update manifest and delta bundle
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          gh release download --repo "${{ github.repository }}" --pattern 'update-manifest.json' --dir previous
          if ($LASTEXITCODE -ne 0) { Write-Host 'previous release has no update-manifest.json yet' }
          $build = @('packaging/update_manifest.py',
                    '--dist', 'dist/T4Translate',
                    '--version', $env:T4_VERSION,
                    '--out', 'dist/update-manifest.json',
                    '--summary', 'dist/update-summary.json',
                    '--delta', "dist/update-$env:T4_TAG.zip")
          if (Test-Path 'previous/update-manifest.json') {
            $build += @('--previous', 'previous/update-manifest.json')
          } else {
            Write-Host 'no previous manifest; this release ships a full manifest'
          }
          python @build
          Get-Item "dist/update-$env:T4_TAG.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Publish release with the built app
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("T4Translate-$env:T4_TAG-windows-x64.zip", 'dist/update-manifest.json')
          $delta = "dist/update-$env:T4_TAG.zip"
          if (Test-Path $delta) { $assets += $delta }
          $notes = "بستهٔ خودکار ویندوز ۶۴بیتی. فایل ZIP را دانلود کنید، کامل از حالت فشرده خارج کنید و T4Translate.exe را اجرا کنید. تست دودِ بسته (سرور، رابط، مدل OCR، فونت‌ها و رندر فارسی) در همین اجرا موفق بوده است.`n`nبرنامه از همین ریلیز به‌روزرسانی خودکار می‌گیرد: update-manifest.json فهرست فایل‌ها و update-$env:T4_TAG.zip فقط فایل‌های تغییرکرده است."
          gh release create $env:T4_TAG @assets `
            --repo "${{ github.repository }}" `
            --title "T-4 Translate — بستهٔ ویندوز ($env:T4_TAG)" `
            --notes $notes
