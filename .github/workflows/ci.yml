name: Windows build and tests

# اجرای خودکار روی هر push و PR؛ اجرای دستی (workflow_dispatch) علاوه بر تست و ساخت،
# یک بستهٔ ZIP قابل دانلود می‌سازد و آن را به یک GitHub Release می‌چسباند.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # فقط برای ساخت ریلیز در اجرای دستی لازم است

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install -e './backend[test,ocr-experimental]'
          python -m pip install -r desktop/requirements.txt

      - name: Run backend tests
        shell: pwsh
        run: |
          python -m pytest backend/tests -q 2>&1 | Tee-Object -FilePath backend-tests.log
          exit $LASTEXITCODE

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-log
          path: backend-tests.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # فونت‌ها با برنامه بسته می‌شوند تا هر دستهٔ بالن فونت خودش را داشته باشد
      # (frontend/public/fonts شامل وزیرمتن و بستهٔ persian-pack است).
      - name: Build Windows desktop application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name T4Translate --paths backend
          --add-data "frontend/dist;web"
          --add-data "frontend/public/fonts;frontend/public/fonts"
          --collect-all rapidocr_onnxruntime
          --collect-all numpy
          --collect-all webview
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          desktop/launcher.py

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & .\dist\T4Translate\T4Translate.exe --smoke-test 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Desktop smoke test::$escaped"
            exit $code
          }

      - uses: actions/upload-artifact@v4
        with:
          name: T4Translate-Windows-${{ github.sha }}
          path: dist/T4Translate/
          if-no-files-found: error
          retention-days: 30

      - name: Package download bundle
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Copy-Item packaging/README-Windows.txt 'dist/T4Translate/README-نصب.txt'
          Compress-Archive -Path 'dist/T4Translate/*' -DestinationPath "T4Translate-${{ github.run_number }}-windows-x64.zip"
          Get-Item "T4Translate-${{ github.run_number }}-windows-x64.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Publish release with the built app
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" `
            "T4Translate-${{ github.run_number }}-windows-x64.zip" `
            --repo "${{ github.repository }}" `
            --title "T-4 Translate — بستهٔ ویندوز (build ${{ github.run_number }})" `
            --notes "بستهٔ خودکار ویندوز ۶۴بیتی. فایل ZIP را دانلود کنید، کامل از حالت فشرده خارج کنید و T4Translate.exe را اجرا کنید. تست دودِ بسته (سرور، رابط، مدل OCR، فونت‌ها و رندر فارسی) در همین اجرا موفق بوده است."
